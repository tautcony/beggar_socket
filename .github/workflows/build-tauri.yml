name: Build Tauri Desktop App

on:
  push:
    branches: ["main"]
    paths:
      - "web-client/**"
      - ".github/workflows/build-tauri.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web-client/**"
      - ".github/workflows/build-tauri.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job_name: Linux
            platform: linux
          - os: windows-latest
            job_name: Windows NSIS
            platform: windows
          - os: macos-latest
            job_name: macOS Universal
            platform: macos
            tauri_args: --target universal-apple-darwin

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: web-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libudev-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        if: matrix.platform == 'linux' || matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust toolchain for macOS universal build
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: web-client/src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install dependencies
        run: npm ci

      - name: Build Linux bundles
        if: matrix.platform == 'linux'
        run: npm run tauri:build -- --bundles appimage deb

      - name: Build Windows NSIS
        if: matrix.platform == 'windows'
        run: npm run tauri:build -- --bundles nsis

      - name: Build Tauri app for macOS universal target
        if: matrix.platform == 'macos'
        run: npm run tauri:build -- ${{ matrix.tauri_args }}

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-linux
          path: |
            web-client/src-tauri/target/release/bundle/appimage/*.AppImage
            web-client/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            web-client/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-windows
          path: |
            web-client/src-tauri/target/release/bundle/nsis/*.exe
            web-client/src-tauri/target/release/bundle/nsis/*.exe.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-macos
          path: |
            web-client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            web-client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            web-client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30
