# This is a basic workflow to help you get started with Actions

name: Build web client & Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web-client/**'
      - '.github/workflows/build-webclient.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Set Sentry release
        id: sentry-release
        run: |
          node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('web-client/package.json', 'utf8')); console.log('release=' + pkg.version + '+' + process.env.GITHUB_SHA)" >> "$GITHUB_OUTPUT"

      - name: Build code
        env:
          VITE_SENTRY_RELEASE: ${{ steps.sentry-release.outputs.release }}
        run: |
          cd web-client
          npm ci
          npm run check:deps
          npm run build

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.sentry-release.outputs.release }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN must be configured in GitHub Actions secrets to publish this build." >&2
            exit 1
          fi
          npx --yes @sentry/cli@3.8.0 releases new "$SENTRY_RELEASE" --org tautcony --project chisflash-burner
          npx --yes @sentry/cli@3.8.0 sourcemaps upload --org tautcony --project chisflash-burner --release "$SENTRY_RELEASE" --url-prefix '~/beggar_socket' --wait web-client/dist
          npx --yes @sentry/cli@3.8.0 releases finalize "$SENTRY_RELEASE" --org tautcony

      - name: Setup _site structure
        run: |
          mkdir -p _site
          cp -r web-client/dist/* _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
