[package]
name = "chisflash-burner"
version = "2.0.0"
description = "ChisFlash Burner desktop client powered by Tauri"
authors = ["tautcony <i@tautcony.xyz>"]
license = "MIT"
repository = "https://github.com/tautcony/beggar_socket"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = [] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10.1"
